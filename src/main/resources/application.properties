# Server Configuration
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Google credentials belong in the backend environment, never frontend variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quote_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Jackson Configuration - Exclude null fields from JSON responses
spring.jackson.default-property-inclusion=non_null
